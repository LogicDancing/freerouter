[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freerouter"
version = "0.1.0"
description = "Free LLM Forever — auto-route across NVIDIA Build, Groq, Cerebras & SambaNova"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "router", "ai", "nvidia", "groq", "cerebras", "free"]
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "aiosqlite>=0.20",
    "rich>=13.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "watchdog>=4.0",
    "tiktoken>=0.7",
]

[project.scripts]
freerouter = "freerouter.cli:app"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["freerouter"]
